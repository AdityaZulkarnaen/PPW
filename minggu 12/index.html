<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="calculator-container">
                    <div class="calculator-header">
                        <h1 class="mb-0">
                            <i class="fas fa-calculator me-2"></i>
                            Kalkulator Sederhana
                        </h1>
                    </div>
                    
                    <div class="p-4">
                        <!-- Input Section -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label for="angka1" class="form-label fw-bold">Angka Pertama</label>
                                <input type="number" class="form-control" id="angka1" placeholder="Masukkan angka pertama">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="angka2" class="form-label fw-bold">Angka Kedua</label>
                                <input type="number" class="form-control" id="angka2" placeholder="Masukkan angka kedua">
                            </div>
                        </div>
                        
                        <!-- Operation Buttons -->
                        <div class="row mb-4">
                            <div class="col-6 col-md-3 mb-2">
                                <button class="btn operation-btn btn-add w-100" onclick="calculate('+')">
                                    <i class="fas fa-plus me-1"></i> +
                                </button>
                            </div>
                            <div class="col-6 col-md-3 mb-2">
                                <button class="btn operation-btn btn-subtract w-100" onclick="calculate('-')">
                                    <i class="fas fa-minus me-1"></i> -
                                </button>
                            </div>
                            <div class="col-6 col-md-3 mb-2">
                                <button class="btn operation-btn btn-multiply w-100" onclick="calculate('×')">
                                    <i class="fas fa-times me-1"></i> ×
                                </button>
                            </div>
                            <div class="col-6 col-md-3 mb-2">
                                <button class="btn operation-btn btn-divide w-100" onclick="calculate('÷')">
                                    <i class="fas fa-divide me-1"></i> ÷
                                </button>
                            </div>
                        </div>
                        
                        <!-- Result Display -->
                        <div id="result" class="result-display"></div>
                        
                        <!-- History Table -->
                        <div id="historySection" class="mt-4" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h4 class="text-primary mb-0">
                                    <i class="fas fa-history me-2"></i>
                                    Riwayat Perhitungan
                                </h4>
                                <button class="btn btn-outline-danger btn-sm" onclick="clearHistory()">
                                    <i class="fas fa-trash me-1"></i>
                                    Hapus Riwayat
                                </button>
                            </div>
                            
                            <div class="table-container">
                                <table class="table table-striped table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th scope="col">No.</th>
                                            <th scope="col">Angka Pertama</th>
                                            <th scope="col">Angka Kedua</th>
                                            <th scope="col">Hasil</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
